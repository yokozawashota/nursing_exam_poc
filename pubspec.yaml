name: nursing_exam_poc
description: "A new Flutter project."
publish_to: 'none'

version: 6.0.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.5
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.0
  crypto: ^3.0.6
  path: ^1.9.0
  characters: ^1.4.0
  flutter_chat_bubble: ^2.0.2
  confetti: ^0.8.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  dart_code_metrics: ^5.7.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/splash/
    - assets/fonts/
    - assets/characters/
    - assets/notices.json
    - assets/past_exam/111/
    - assets/fig/111/
    - assets/past_exam/113/
    - assets/fig/113/

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  fullscreen: true
  color: "#FFFFFF"
  image: assets/splash/nurai_splash.png

  android: true
  ios: true
  web: false

  android_12:
    color: "#FFFFFF"
    image: assets/splash/nurai_splash.png