name: Build folder-split dart indices

on:
  push:
    branches: ['**']
    paths:
      - 'lib/**/*.dart'
      - 'tool/**/*.dart'
      - '.github/workflows/dart-index.yml'
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Flutter SDK を入れる（Dart 単体ではなく）
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'   # 例：安定版。必要ならプロジェクトに合わせて変更

      - name: Install dependencies
        run: flutter pub get

      - name: Generate split indices
        shell: bash
        run: |
          set -euo pipefail
          # あなたのスクリプト名/場所に合わせて。例：tool/build_dart_index.dart
          dart run tool/build_dart_index.dart
          echo "Generated files:"
          ls -la .dart-index || true

      - name: Commit index files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code -- .dart-index; then
            echo "No changes, skip commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .dart-index
          git commit -m "ci: update folder-split dart indices"
          git push