name: Build dart-index.json

on:
  push:
    branches: ['**']
    paths:
      - 'lib/**/*.dart'
      - 'tool/dart_index.dart'
      - '.github/workflows/dart-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Generate dart-index.json
        run: dart tool/dart_index.dart > dart-index.json
      - name: Commit dart-index.json
        run: |
          if git diff --quiet --exit-code -- dart-index.json; then
            echo "No changes, skip commit"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dart-index.json
          git commit -m "ci: update dart-index.json"
          git push