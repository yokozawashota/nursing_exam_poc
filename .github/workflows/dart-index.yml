name: Build folder-split dart indices

on:
  push:
    branches: ['**']
    paths:
      - 'lib/**/*.dart'
      - 'tool/**'
      - '.github/workflows/dart-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Generate split indices
        run: |
          set -e
          mkdir -p .dart-index
          # 例）分割出力するスクリプト（あなたの実装に合わせてコマンドを変更）
          # dart tool/dart_index.dart --split --out .dart-index
          dart tool/dart_index.dart --out-dir .dart-index

          echo "Generated files:"
          ls -la .dart-index

      - name: Commit index files
        run: |
          # 生成物のみをステージング（追加/更新/削除すべて）
          git add -A .dart-index

          # ステージ済みに差分がなければスキップ
          if git diff --cached --quiet --exit-code; then
            echo "No changes, skip commit"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: update folder-split dart indices"
          git push　