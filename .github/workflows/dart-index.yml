name: Build folder-split dart indices

on:
  push:
    branches: ['**']
    paths:
      - 'lib/**/*.dart'
      - 'tool/build_dart_index.dart'
      - '.github/workflows/dart-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Generate split indices
        shell: bash
        run: |
          set -euo pipefail
          dart --version
          dart tool/build_dart_index.dart

      - name: Commit index files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code -- .dart-index; then
            echo "No changes, skip commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .dart-index
          git commit -m "ci: update folder-split dart indices"
          git push