name: Build folder-split dart indices

on:
  push:
    branches: ['**']
    paths:
      - 'lib/**/*.dart'
      - 'tool/build_dart_index.dart'
      - '.github/workflows/dart-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # bot のコミットでの自己起動はスキップ
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Generate split indices
        run: |
          set -euo pipefail
          rm -rf .dart-index
          mkdir -p .dart-index
          dart tool/build_dart_index.dart
          echo "Generated files:"
          ls -la .dart-index || true

      - name: Commit index files
        run: |
          set -euo pipefail
          # 変更がなければ抜ける
          if git diff --quiet --exit-code -- .dart-index; then
            echo "No changes, skip commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .dart-index
          git commit -m "ci: update folder-split dart indices"
          git push