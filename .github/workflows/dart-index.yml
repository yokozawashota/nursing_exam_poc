name: Build folder-split dart indices

on:
  push:
    branches: ['**']
    paths:
      - 'lib/**/*.dart'
      - 'tool/build_dart_index.dart'
      - '.github/workflows/dart-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get || true

      - name: Generate split indices
        shell: bash
        run: |
          set -euo pipefail
          echo "Cleaning previous .dart-index..."
          rm -rf .dart-index
          mkdir -p .dart-index

          echo "Running build_dart_index.dart..."
          flutter pub run tool/build_dart_index.dart

          echo "Generated files:"
          ls -laR .dart-index || echo "No output generated!"

      - name: Commit index files
        shell: bash
        run: |
          set -e
          if git diff --quiet --exit-code -- .dart-index; then
            echo "No changes detected. Skip commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .dart-index
          git commit -m "ci: update folder-split dart indices"
          git push