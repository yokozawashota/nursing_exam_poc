name: Build dart-index.json

on:
  push:
    branches: [ main, 'Ver*' ]   # ← Ver1.0.3 のようなブランチでも動く
    paths:
      - 'lib/**/*.dart'
      - 'tool/dart_index.dart'
      - '.github/workflows/dart-index.yml'
  pull_request:
    paths:
      - 'lib/**/*.dart'
      - 'tool/dart_index.dart'

permissions:
  contents: write

jobs:
  build-index:
    # bot が dart-index.json をコミットした push での再実行を抑止（無限ループ防止）
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Generate dart-index.json
        run: dart run tool/dart_index.dart lib

      # 変更があるときだけコミット＆プッシュ
      - name: Commit & push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(index): update dart-index.json [skip ci]'
          file_pattern: dart-index.json
          branch: ${{ github.ref_name }}