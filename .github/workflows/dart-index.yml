name: Build folder-split dart indices

on:
  push:
    branches: ['**']
    paths:
      - 'lib/**/*.dart'
      - 'tool/build_dart_index.dart'
      - '.github/workflows/dart-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) リポジトリ取得
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Flutter 3.35.6（Dart 3.9.x）をセットアップ
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'
          cache: true

      # 3) 依存解決（pubspecが無いCIでも失敗しないように || true）
      - name: Install dependencies
        run: flutter pub get || true

      # 4) フォルダ単位のインデックス生成
      - name: Generate split indices
        shell: bash
        run: |
          set -euo pipefail
          echo "Cleaning previous .dart-index..."
          rm -rf .dart-index
          mkdir -p .dart-index
          echo "Running build_dart_index.dart..."
          dart tool/build_dart_index.dart
          echo "Generated files under .dart-index:"
          ls -laR .dart-index || echo "No output generated!"

      # 5) 変更があればコミット・プッシュ
      - name: Commit index files
        shell: bash
        run: |
          set -e
          if git diff --quiet --exit-code -- .dart-index; then
            echo "No changes detected. Skip commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .dart-index
          git commit -m "ci: update folder-split dart indices"
          git push