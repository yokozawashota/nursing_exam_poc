name: Build dart-index.json

on:
  push:
    branches: [ Ver1.0.3 ]   # ← 対象ブランチは必要に応じて変更
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Generate dart-index.json
        run: |
          dart --version
          dart pub get
          dart run tool/dart_index.dart > dart-index.json

      - name: Commit dart-index.json (if changed)
        run: |
          if git diff --quiet --exit-code -- dart-index.json; then
            echo "No changes in dart-index.json"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dart-index.json
            git commit -m "ci: update dart-index.json"
            git push
          fi