name: Build dart-index.json

on:
  push:
    branches:
      - 'Ver*'
      - main
    paths:
      - 'lib/**/*.dart'
      - 'tool/dart_index.dart'
      - '.github/workflows/dart-index.yml'
  workflow_dispatch:
  pull_request:
    branches: [ main ]     # 任意：PRでも生成だけは走らせる
    paths:
      - 'lib/**/*.dart'
      - 'tool/dart_index.dart'
      - '.github/workflows/dart-index.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Generate dart-index.json
        run: dart run tool/dart_index.dart lib

      # ← ここがポイント：PR では push しない
      - name: Commit & push if changed
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if git status --porcelain | grep -q 'dart-index.json'; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dart-index.json
            git commit -m "chore: update dart-index.json [skip ci]"
            git push
          else
            echo "No changes in dart-index.json"
          fi